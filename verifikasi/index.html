<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Data Mahasiswa PPG - STK Santo Yakobus Merauke</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Komponen Logo STK
        const STKLogo = () => {
            const [logoLoaded, setLogoLoaded] = useState(true);

            const handleLogoError = () => {
                setLogoLoaded(false);
            };

            return (
                <div className="flex items-center justify-center mb-6">
                    {logoLoaded ? (
                        <img
                            src="https://stkyakobus.ac.id/verifikasi/assets/stk-logo.png"
                            alt="Logo STK Yakobus"
                            className="h-16 w-16"
                            onError={handleLogoError}
                        />
                    ) : (
                        <div className="h-16 w-16 bg-blue-600 text-white flex items-center justify-center rounded-full text-sm font-bold">
                            STK<br />YAKOBUS
                        </div>
                    )}
                </div>
            );
        };

        const StudentVerificationApp = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [loginAccount, setLoginAccount] = useState('');
            const [studentData, setStudentData] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [isConfirmed, setIsConfirmed] = useState(false);
            const [formData, setFormData] = useState({});
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const [successMessage, setSuccessMessage] = useState('');

            // Base URL untuk API
            const API_BASE_URL = './api';

            const showMessage = (message, type = 'success') => {
                if (type === 'success') {
                    setSuccessMessage(message);
                    setError('');
                } else {
                    setError(message);
                    setSuccessMessage('');
                }
                
                setTimeout(() => {
                    setSuccessMessage('');
                    setError('');
                }, 5000);
            };

            const handleLogin = async () => {
                if (!loginAccount.trim()) {
                    setError('Nomor akun harus diisi');
                    return;
                }

                setLoading(true);
                setError('');

                try {
                    const response = await fetch(`${API_BASE_URL}/login.php`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            account: loginAccount.trim()
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        setStudentData(result.data);
                        setFormData(result.data);
                        setIsConfirmed(result.data.confirmed === true || result.data.confirmed === 1);
                        setIsLoggedIn(true);
                        showMessage('Login berhasil!');
                    } else {
                        setError(result.message || 'Login gagal');
                    }
                } catch (err) {
                    console.error('Login error:', err);
                    setError('Terjadi kesalahan koneksi. Pastikan Anda terhubung internet.');
                } finally {
                    setLoading(false);
                }
            };

            const handleInputChange = (field, value) => {
                setFormData(prev => ({
                    ...prev,
                    [field]: value
                }));
            };

            // Fungsi terintegrasi untuk update + konfirmasi
            const handleConfirmData = async () => {
                // Validasi data wajib
                const requiredFields = {
                    'nama': 'Nama',
                    'nik': 'NIK', 
                    'tempat_lahir': 'Tempat Lahir',
                    'tanggal_lahir': 'Tanggal Lahir',
                    'jenis_kelamin': 'Jenis Kelamin',
                    'nama_ibu': 'Nama Ibu',
                    'email': 'Email',
                    'no_handphone': 'No. Handphone',
                    'provinsi': 'Provinsi',
                    'kabupaten_kota': 'Kabupaten/Kota',
                    'kecamatan': 'Kecamatan',
                    'desa': 'Desa/Kelurahan'
                };

                const missingFields = [];
                for (const [field, label] of Object.entries(requiredFields)) {
                    if (!formData[field] || formData[field].toString().trim() === '') {
                        missingFields.push(label);
                    }
                }

                if (missingFields.length > 0) {
                    setError(`Data tidak lengkap. Field berikut wajib diisi: ${missingFields.join(', ')}`);
                    return;
                }

                setLoading(true);
                setError('');

                try {
                    // LANGKAH 1: Update data terlebih dahulu (jika ada perubahan)
                    const hasChanges = JSON.stringify(formData) !== JSON.stringify(studentData);
                    
                    if (hasChanges) {
                        console.log('Melakukan update data...');
                        
                        const updateResponse = await fetch(`${API_BASE_URL}/update.php`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                nim: formData.nim,
                                ...formData
                            })
                        });

                        const updateResult = await updateResponse.json();
                        
                        if (!updateResult.success) {
                            throw new Error(updateResult.message || 'Gagal menyimpan perubahan data');
                        }
                        
                        console.log('Data berhasil diupdate');
                        
                        // Update studentData dengan data terbaru
                        setStudentData(formData);
                    }

                    // LANGKAH 2: Konfirmasi dan kunci data
                    console.log('Melakukan konfirmasi data...');
                    
                    const confirmResponse = await fetch(`${API_BASE_URL}/confirm.php`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            nim: formData.nim
                        })
                    });

                    const confirmResult = await confirmResponse.json();

                    if (confirmResult.success) {
                        setIsConfirmed(true);
                        setIsEditing(false);
                        showMessage('Data telah berhasil disimpan dan dikonfirmasi. Data Anda telah terkunci.');
                        
                        // Refresh data dari server untuk memastikan sinkronisasi
                        await refreshStudentData();
                        
                    } else {
                        throw new Error(confirmResult.message || 'Gagal mengonfirmasi data');
                    }

                } catch (err) {
                    console.error('Confirm data error:', err);
                    setError(`Terjadi kesalahan: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            // Fungsi helper untuk refresh data dari server
            const refreshStudentData = async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/login.php`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            account: formData.nim
                        })
                    });

                    const result = await response.json();
                    
                    if (result.success) {
                        setStudentData(result.data);
                        setFormData(result.data);
                    }
                } catch (err) {
                    console.error('Refresh data error:', err);
                }
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setStudentData(null);
                setFormData({});
                setLoginAccount('');
                setIsConfirmed(false);
                setIsEditing(false);
                setError('');
                setSuccessMessage('');
            };

            // Render Action Buttons - hanya satu tombol untuk simpan & konfirmasi
            const renderActionButtons = () => {
                if (isConfirmed) {
                    return (
                        <div className="bg-green-50 border border-green-200 rounded-lg p-4 mt-6">
                            <div className="flex items-center">
                                <div className="text-green-600 mr-3 text-xl">✓</div>
                                <div>
                                    <p className="text-green-800 font-medium">Data Dikonfirmasi</p>
                                    <p className="text-green-600 text-sm">
                                        Data telah dikonfirmasi dan terkunci. Siap untuk input ke PDDIKTI.
                                    </p>
                                    {studentData.confirmed_at && (
                                        <p className="text-green-600 text-xs mt-1">
                                            Dikonfirmasi pada: {new Date(studentData.confirmed_at).toLocaleString('id-ID')}
                                        </p>
                                    )}
                                </div>
                            </div>
                        </div>
                    );
                }

                if (isEditing) {
                    return (
                        <div className="flex flex-col space-y-3 mt-6">
                            {/* Hanya satu tombol SIMPAN & KONFIRMASI DATA */}
                            <button
                                onClick={handleConfirmData}
                                disabled={loading}
                                className={`w-full py-3 px-4 rounded-lg font-medium transition-all duration-200 ${
                                    loading 
                                        ? 'bg-gray-400 cursor-not-allowed' 
                                        : 'bg-green-600 hover:bg-green-700 text-white shadow-lg hover:shadow-xl'
                                }`}
                            >
                                {loading ? 'Menyimpan & Mengonfirmasi...' : '💾 SIMPAN & KONFIRMASI DATA'}
                            </button>
                            
                            <div className="bg-blue-50 border border-blue-200 rounded-lg p-3">
                                <p className="text-blue-800 text-sm">
                                    <strong>Catatan:</strong> Tombol di atas akan otomatis menyimpan semua perubahan yang Anda buat dan mengunci data untuk input ke PDDIKTI.
                                </p>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="flex flex-col space-y-3 mt-6">
                        <button
                            onClick={() => setIsEditing(true)}
                            className="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-all duration-200 shadow-lg hover:shadow-xl"
                        >
                            ✏️ EDIT DATA
                        </button>
                    </div>
                );
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-xl shadow-xl p-8">
                            {/* Logo Section */}
                            <div className="text-center mb-8">
                                <STKLogo />
                                <h1 className="text-2xl font-bold text-gray-900 mb-2">
                                    Verifikasi Data Mahasiswa PPG
                                </h1>
                                <p className="text-gray-600 text-center leading-relaxed">
                                    Sekolah Tinggi Katolik Santo Yakobus Merauke
                                </p>
                                <p className="text-sm text-gray-500 mt-2 bg-blue-50 px-3 py-1 rounded-full inline-block">
                                    Semester: 2025/2026 Ganjil
                                </p>
                            </div>

                            <div className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Nomor Akun (NIM/NISN)
                                    </label>
                                    <input
                                        type="text"
                                        value={loginAccount}
                                        onChange={(e) => setLoginAccount(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                                        placeholder="Masukkan Nomor Akun"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                                        disabled={loading}
                                    />
                                </div>

                                {error && (
                                    <div className="bg-red-50 border border-red-200 rounded-lg p-4">
                                        <p className="text-red-600 text-sm">{error}</p>
                                    </div>
                                )}

                                <button
                                    onClick={handleLogin}
                                    disabled={loading}
                                    className={`w-full py-3 px-4 rounded-lg font-medium transition-all duration-200 ${
                                        loading 
                                            ? 'bg-gray-400 cursor-not-allowed' 
                                            : 'bg-blue-600 hover:bg-blue-700 text-white shadow-lg hover:shadow-xl'
                                    }`}
                                >
                                    {loading ? 'Sedang Login...' : 'LOGIN'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <div className="bg-white shadow-sm border-b">
                        <div className="max-w-4xl mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-4">
                                    <div className="h-12 w-12 bg-blue-600 text-white flex items-center justify-center rounded-lg text-xs font-bold">
                                        STK
                                    </div>
                                    <div>
                                        <h1 className="text-xl font-bold text-gray-900">Detail Mahasiswa</h1>
                                        <p className="text-sm text-gray-600">Sekolah Tinggi Katolik Santo Yakobus Merauke - Semester: 2025/2026 Ganjil</p>
                                    </div>
                                </div>
                                <div className="flex items-center space-x-2">
                                    {isConfirmed && (
                                        <span className="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-medium">
                                            ✓ Data Dikonfirmasi
                                        </span>
                                    )}
                                    <button
                                        onClick={handleLogout}
                                        className="px-4 py-2 text-gray-600 hover:text-gray-800 transition-colors"
                                    >
                                        Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="max-w-4xl mx-auto px-4 py-8">
                        {/* Messages */}
                        {successMessage && (
                            <div className="bg-green-50 border border-green-200 rounded-lg p-4 mb-6">
                                <p className="text-green-600">{successMessage}</p>
                            </div>
                        )}

                        {error && (
                            <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                                <p className="text-red-600">{error}</p>
                            </div>
                        )}

                        {/* Data Form */}
                        <div className="bg-white rounded-xl shadow-lg p-6">
                            <div className="flex items-center mb-6">
                                <div className="text-blue-600 mr-3 text-xl">👤</div>
                                <h2 className="text-xl font-bold text-gray-900">Data Mahasiswa</h2>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {/* NIM - Read Only */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        NIM
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.nim || ''}
                                        disabled={true}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-600"
                                    />
                                </div>

                                {/* Nama */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Nama <span className="text-red-500">*</span>
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.nama || ''}
                                        onChange={(e) => handleInputChange('nama', e.target.value)}
                                        disabled={!isEditing}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50"
                                    />
                                </div>

                                {/* Tempat Lahir */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Tempat Lahir <span className="text-red-500">*</span>
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.tempat_lahir || ''}
                                        onChange={(e) => handleInputChange('tempat_lahir', e.target.value)}
                                        disabled={!isEditing}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50"
                                    />
                                </div>

                                {/* Jenis Kelamin */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Jenis Kelamin <span className="text-red-500">*</span>
                                    </label>
                                    <select
                                        value={formData.jenis_kelamin || ''}
                                        onChange={(e) => handleInputChange('jenis_kelamin', e.target.value)}
                                        disabled={!isEditing}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50"
                                    >
                                        <option value="">Pilih Jenis Kelamin</option>
                                        <option value="Laki-laki">Laki-laki</option>
                                        <option value="Perempuan">Perempuan</option>
                                    </select>
                                </div>

                                {/* Nama Ibu */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Nama Ibu <span className="text-red-500">*</span>
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.nama_ibu || ''}
                                        onChange={(e) => handleInputChange('nama_ibu', e.target.value)}
                                        disabled={!isEditing}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50"
                                    />
                                </div>

                                {/* Tanggal Lahir */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Tanggal Lahir <span className="text-red-500">*</span>
                                    </label>
                                    <input
                                        type="date"
                                        value={formData.tanggal_lahir || ''}
                                        onChange={(e) => handleInputChange('tanggal_lahir', e.target.value)}
                                        disabled={!isEditing}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50"
                                    />
                                </div>

                                {/* Agama */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Agama <span className="text-red-500">*</span>
                                    </label>
                                    <select
                                        value={formData.agama || ''}
                                        onChange={(e) => handleInputChange('agama', e.target.value)}
                                        disabled={!isEditing}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50"
                                    >
                                        <option value="">Pilih Agama</option>
                                        <option value="Katolik">Katolik</option>
                                        <option value="Kristen">Kristen</option>
                                        <option value="Islam">Islam</option>
                                        <option value="Hindu">Hindu</option>
                                        <option value="Buddha">Buddha</option>
                                        <option value="Konghucu">Konghucu</option>
                                    </select>
                                </div>

                                {/* NIK */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        NIK <span className="text-red-500">*</span>
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.nik || ''}
                                        onChange={(e) => handleInputChange('nik', e.target.value)}
                                        disabled={!isEditing}
                                        maxLength="16"
                                        placeholder="16 digit angka"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50"
                                    />
                                </div>

                                {/* No. Handphone */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        No. Handphone <span className="text-red-500">*</span>
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.no_handphone || ''}
                                        onChange={(e) => handleInputChange('no_handphone', e.target.value)}
                                        disabled={!isEditing}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50"
                                    />
                                </div>

                                {/* Email */}
                                <div className="md:col-span-2">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Email <span className="text-red-500">*</span>
                                    </label>
                                    <input
                                        type="email"
                                        value={formData.email || ''}
                                        onChange={(e) => handleInputChange('email', e.target.value)}
                                        disabled={!isEditing}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50"
                                    />
                                </div>

                                {/* Kewarganegaraan - Read Only */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Kewarganegaraan
                                    </label>
                                    <input
                                        type="text"
                                        value="Indonesia"
                                        disabled={true}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-600"
                                    />
                                </div>

                                {/* Program Studi - Read Only */}
                                <div className="md:col-span-2">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Program Studi
                                    </label>
                                    <input
                                        type="text"
                                        value="Pendidikan Profesi Guru Pendidikan Agama Katolik"
                                        disabled={true}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-600"
                                    />
                                </div>

                                {/* Jenis Pendaftaran - Read Only */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Jenis Pendaftaran
                                    </label>
                                    <input
                                        type="text"
                                        value="PPG Non PGP/PLPG"
                                        disabled={true}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-600"
                                    />
                                </div>

                                {/* Jalur Pendaftaran - Read Only */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Jalur Pendaftaran
                                    </label>
                                    <input
                                        type="text"
                                        value="Program Kerjasama Perusahaan/Institusi/Pemerintah"
                                        disabled={true}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-600"
                                    />
                                </div>

                                {/* Provinsi */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Provinsi <span className="text-red-500">*</span>
                                    </label>
                                    <select
                                        id="provinsi"
                                        value={formData.provinsi || ''}
                                        onChange={(e) => {
                                            const selectedOption = e.target.selectedOptions[0];
                                            const provinceName = selectedOption?.dataset?.name || selectedOption?.text || '';
                                            handleInputChange('provinsi', provinceName);
                                        }}
                                        disabled={!isEditing}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50"
                                    >
                                        <option value="">Pilih Provinsi</option>
                                        {/* Options akan dimuat oleh JavaScript */}
                                    </select>
                                </div>

                                {/* Kabupaten/Kota */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Kabupaten/Kota <span className="text-red-500">*</span>
                                    </label>
                                    <select
                                        id="kabupaten_kota"
                                        value={formData.kabupaten_kota || ''}
                                        onChange={(e) => {
                                            const selectedOption = e.target.selectedOptions[0];
                                            const regencyName = selectedOption?.dataset?.name || selectedOption?.text || '';
                                            handleInputChange('kabupaten_kota', regencyName);
                                        }}
                                        disabled={!isEditing}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50"
                                    >
                                        <option value="">Pilih Kabupaten/Kota</option>
                                        {/* Options akan dimuat oleh JavaScript */}
                                    </select>
                                </div>

                                {/* Kecamatan */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Kecamatan <span className="text-red-500">*</span>
                                    </label>
                                    <select
                                        id="kecamatan"
                                        value={formData.kecamatan || ''}
                                        onChange={(e) => {
                                            const selectedOption = e.target.selectedOptions[0];
                                            const districtName = selectedOption?.dataset?.name || selectedOption?.text || '';
                                            handleInputChange('kecamatan', districtName);
                                        }}
                                        disabled={!isEditing}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50"
                                    >
                                        <option value="">Pilih Kecamatan</option>
                                        {/* Options akan dimuat oleh JavaScript */}
                                    </select>
                                </div>

                                {/* Desa/Kelurahan */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Desa/Kelurahan <span className="text-red-500">*</span>
                                    </label>
                                    <select
                                        id="desa"
                                        value={formData.desa || ''}
                                        onChange={(e) => {
                                            const selectedOption = e.target.selectedOptions[0];
                                            const villageName = selectedOption?.dataset?.name || selectedOption?.text || '';
                                            handleInputChange('desa', villageName);
                                        }}
                                        disabled={!isEditing}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50"
                                    >
                                        <option value="">Pilih Desa/Kelurahan</option>
                                        {/* Options akan dimuat oleh JavaScript */}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        NPWP
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.npwp || ''}
                                        onChange={(e) => handleInputChange('npwp', e.target.value)}
                                        disabled={!isEditing}
                                        placeholder="Contoh: 123456789012345"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50"
                                    />
                                </div>

                                <div className="md:col-span-2">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Alamat Jalan
                                    </label>
                                    <textarea
                                        value={formData.alamat_jalan || ''}
                                        onChange={(e) => handleInputChange('alamat_jalan', e.target.value)}
                                        disabled={!isEditing}
                                        rows="3"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-50"
                                    />
                                </div>
                            </div>

                            {isConfirmed && (
                                <div className="mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">
                                    <p className="text-green-800 text-center font-medium">
                                        ✅ Data telah dikonfirmasi dan terkunci. Siap untuk input ke PDDIKTI.
                                    </p>
                                    {studentData.confirmed_at && (
                                        <p className="text-green-600 text-sm text-center mt-1">
                                            Dikonfirmasi pada: {new Date(studentData.confirmed_at).toLocaleString('id-ID')}
                                        </p>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* Action Buttons - Dipindahkan ke paling bawah */}
                        {renderActionButtons()}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<StudentVerificationApp />, document.getElementById('root'));
    </script>
    
    <script src="wilayah-indonesia.js"></script>
    
    <script>
    // Integrasi dengan React component
    document.addEventListener('DOMContentLoaded', function() {
        // Expose handleInputChange ke global scope untuk wilayah-indonesia.js
        window.handleInputChange = (field, value) => {
            // Trigger React state update
            const event = new CustomEvent('wilayahChange', {
                detail: { field, value }
            });
            document.dispatchEvent(event);
        };
        
        // Listen untuk update data existing
        document.addEventListener('dataLoaded', async function(e) {
            const data = e.detail;
            
            // Set wilayah jika ada data existing
            if (data.provinsi || data.kabupaten_kota || data.kecamatan || data.desa) {
                // Tunggu wilayahIndonesia ready
                if (window.wilayahIndonesia) {
                    await window.wilayahIndonesia.setWilayah(
                        data.provinsi,
                        data.kabupaten_kota, 
                        data.kecamatan,
                        data.desa
                    );
                }
            }
        });
    });
    
    // Update handleInputChange di React component untuk listen wilayah changes
    const originalHandleInputChange = handleInputChange;
    handleInputChange = (field, value) => {
        setFormData(prev => ({
            ...prev,
            [field]: value
        }));
    };
    
    // Listen untuk changes dari wilayah dropdown
    document.addEventListener('wilayahChange', function(e) {
        const { field, value } = e.detail;
        handleInputChange(field, value);
    });
    
    // Trigger dataLoaded event setelah login sukses (tambahkan di function handleLogin)
    // Setelah setFormData(result.data); tambahkan:
    document.dispatchEvent(new CustomEvent('dataLoaded', {
        detail: result.data
    }));
    </script>
